[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "afow"
version = "0.1.0"
description = "Fast, cross-platform file organizer for Linux (Fedora), Windows, and macOS."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Shiva Sathvik" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
web = ["flask>=3.0"]
test = ["pytest"]

[project.scripts]
afow = "afow.cli:main"

[tool.setuptools.packages.find]
include = ["afow*"]
